services:
  backend:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - /backend/.venv
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:18
    container_name: record_social_postgres_db
    restart: always
    environment:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  postgres-data:
